spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: ${resourceflow.datasource.driver-class-name}
    url: jdbc:mysql://${resourceflow.datasource.host}:${resourceflow.datasource.port}/${resourceflow.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${resourceflow.datasource.username}
    password: ${resourceflow.datasource.password}

  data:
    redis:
      host: ${resourceflow.redis.host}
      port: ${resourceflow.redis.port}
      database: ${resourceflow.redis.database}

mybatis-plus:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.github.acer20246.resourceflow.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

#日志
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
#swagger
springdoc:
  packages-to-scan: com.github.acer20246.resourceflow.controller

resourceflow:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    secret-key: ${JWT_SECRET_KEY:default_32byte_key_1234567890123456}
    # 设置jwt过期时间
    jwtExpirationMillis: 7200000


